<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <script>
        //Primitive datatype
        //Boolean, Null, string, numbers
        
        var x = "hello";
        var y = 10;
        var z = true
        var g = null;
        //let test = 10;
        //let test = "hello";
        var y = "name";
        var name = "shakir"
        var number = 34;
        var x1 = 30;
         x1 = 40;
        console.log(x1);
        let x2 = 50;
        x2 = 100;
        const shakir = 3.0;
        shakir = 3.5;
        //composite datatypes
        //object,function,arrays

//        (Var) Used in older JavaScript

//         Function scoped

//         Can be re-declared and updated
var x = 10;
var x = 20; // ✅ allowed
x = 30;     // ✅ allowed

console.log(x); // 30

// var (Modern way)

// Introduced in ES6

// Block scoped

// Can be updated

// ❌ Cannot be re-declared in same scope

let a = 10;
a = 20; // ✅ allowed

//let a = 30; // ❌ Error (re-declare not allowed)


// const (Constant value)

// Block scoped

// ❌ Cannot be updated

// ❌ Cannot be re-declared

const pi = 3.14;
pi = 3.15; // ❌ Error
    </script>
</body>
</html>
