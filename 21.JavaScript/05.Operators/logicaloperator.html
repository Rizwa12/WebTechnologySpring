<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   <script>
    let a = 10;
    let b = 20;

    document.write("AND Result: " + (a > 5 && b > 15) + "<br>");//and operator
    document.write("OR Result: " + (a > 15 || b > 15) + "<br>");//or operator
    let isStudent = true;
    document.write("NOT Result: " + (!isStudent) + "<br>");
    document.write("NOT Result: " + !(a===b) + "<br>");
</script>
</body>
</html>
