<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function autoSwap()
        {
            setInterval(swap,3000)
        }
        function swap()
        {
            var image = document.getElementsByClassName("myimg");
            var temp = image[0].src
             image[0].src = image[1].src
             image[1].src = temp;
            
        }
    </script>
</head>
<body onload="autoSwap()">
    <img class="myimg" src="images/images1.jpg" height="200px" width="200px" />
     <!-- <input type="button" value="SWAP" onclick="swap();" /> -->
     <img class="myimg" src="images/images2.jpg" height="200px" width="200px" />
</body>
</html>
