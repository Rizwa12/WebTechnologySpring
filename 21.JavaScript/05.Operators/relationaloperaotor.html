<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
    let num1 = 10;
    let num2 = 20;

    document.write("num1 > num2: " + (num1 > num2) + "<br>"); //greater than
    document.write("num1 < num2: " + (num1 < num2) + "<br>"); //Less than
    document.write("num1 >= num2: " + (num1 >= num2) + "<br>");//Greater or equal
    document.write("num1 <= num2: " + (num1 <= num2) + "<br>"); //Less or equal

    document.write("num1 == num2: " + (num1 == num2) + "<br>"); //Equal
    document.write("num1 != num2: " + (num1 != num2) + "<br>"); //NotEqual

    // Important difference
    let a = 10;
    let b = "10";

    document.write("a == b: " + (a == b) + "<br>");   // true
    document.write("a === b: " + (a === b) + "<br>"); // false
</script>
</body>
</html>
