<!DOCTYPE html>
<html>
<head>
    <title>Redirect Page</title>
    <script>
        // This function runs when page loads
        function redirectPage() {
            // Wait 1 second (1000 ms) and then redirect
            setTimeout(function() {
                window.location.href = "https://www.google.com"; // new URL
            }, 1000); // 1000 milliseconds = 1 second
        }
        
        
    </script>
</head>
<body onload="redirectPage()">

<h1>Redirecting to Google in 1 second...</h1>

</body>
</html>
